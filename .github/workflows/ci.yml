name: CI

on:
  pull_request:
    branches: [dev, main]

# Every job installs with `uv sync --dev --locked`. The `--locked` is the point:
# plain `uv sync` silently *updates* uv.lock when it has drifted from
# pyproject.toml, so a dependency edit committed without re-locking went green
# and the lockfile in the repo stopped describing what CI actually tested.
# `--locked` fails instead, which is what makes the lockfile a real pin rather
# than a convention — and the lockfile is the only thing standing between this
# project and a dependency surface whose floors are mostly unstated.
# When it fails: run `uv lock` and commit the result with your change.

jobs:
  # Required gate: every commit in the PR must follow Conventional Commits.
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          pattern='^(feat|fix|docs|chore|perf|refactor|style|test|build|ci|revert)(\(.+\))?!?: .+'
          fail=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            case "$msg" in
              "Merge "*) continue ;;
            esac
            if ! printf '%s' "$msg" | grep -Eq "$pattern"; then
              echo "::error::Non-conventional commit message: $msg"
              fail=1
            fi
          done < <(git log --format=%s --no-merges "$base..$head")
          if [ "$fail" -ne 0 ]; then
            echo "Commit messages must follow Conventional Commits (feat:, fix:, docs:, chore:, perf:, refactor:)."
            exit 1
          fi

  # Required gate on dev PRs only: feature branches must use an approved prefix.
  branch-name:
    name: branch-name
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      # Through env, not interpolated into the script: a branch name is chosen
      # by whoever opens the PR, and `${{ }}` is pasted in before the shell
      # parses it, so a name carrying a quote could run commands.
      - name: Validate branch name
        env:
          branch: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$branch" | grep -Eq '^(feature|fix|docs|chore|perf|refactor)/.+'; then
            echo "::error::Branch '$branch' must start with feature/, fix/, docs/, chore/, perf/, or refactor/."
            exit 1
          fi

  # Required gate. The job name is a required status check on dev and main, so
  # it must stay a single job called exactly "quality" — turning it into a
  # matrix would rename the contexts to "quality (3.11)" etc., the required
  # "quality" check would never report, and every PR would block forever.
  # Additional interpreters go in `tests-matrix` below instead.
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev --locked
      - run: uv run ruff check h2mare/ tests/ scripts/
      - run: uv run ruff format --check h2mare/ tests/ scripts/
      - run: uv run pytest tests/

  # Informational only — pyright currently reports ~200 findings, most of them
  # pandas/xarray stub noise rather than defects, so gating on it would block
  # every PR. It runs to keep the count visible and stop it growing unnoticed;
  # `continue-on-error` means a finding annotates the PR without failing it.
  # Promote it to a required check in branch protection once the count is at
  # zero — and see the note on `quality` before touching that job's name.
  typecheck:
    name: typecheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev --locked
      - name: pyright
        run: uv run pyright h2mare --outputjson > pyright.json || true
      - name: Summarise findings
        run: |
          uv run python - <<'PY'
          import collections, json, pathlib
          d = json.loads(pathlib.Path("pyright.json").read_text())
          diags = d.get("generalDiagnostics", [])
          print(f"pyright findings: {len(diags)}")
          by_rule = collections.Counter(x.get("rule", "(none)") for x in diags)
          for rule, n in by_rule.most_common():
              print(f"{n:5}  {rule}")
          PY

  # The floor (3.11) is covered by `quality`; this covers the rest of the range
  # pyproject advertises. Not a required check — it exists so a break on a newer
  # interpreter is visible on the PR rather than at release time.
  tests-matrix:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev --locked
      - run: uv run pytest tests/ -q
