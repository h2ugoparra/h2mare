name: Publish to PyPI

on:
  release:
    types: [published]

# Read-only by default. The one job that needs more — publish, which mints a
# short-lived PyPI token through trusted publishing — asks for it itself.
permissions:
  contents: read

# Every action is pinned to a commit, with its version in a comment: a tag or
# a branch (`release/v1`) can be moved to point at other code, and the publish
# job holds a credential that uploads to PyPI. Bump a pin by resolving the new
# tag's commit (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`).

jobs:
  # CI runs on pull requests, so nothing tested the commit a release actually
  # points at. A tag can sit on a commit no PR ran against, and dev -> main
  # merges are the last place anything can still break.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - run: uv sync --dev --locked
      - run: uv run pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      # PyPI versions are immutable: a release tagged v0.9.0 over a
      # pyproject.toml still reading 0.8.1 would publish 0.8.1's number with
      # 0.9.0's code, or fail the upload after everything else had run.
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Build package
        run: uv build

      # The lockfile is what CI installs from, and it hid undeclared runtime
      # dependencies until someone ran `pip install h2mare`. This installs the
      # wheel the way a user does — resolved fresh from its own metadata, no
      # lock — and imports it.
      - name: Install the wheel as a user would
        run: |
          uv venv --python 3.11 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import h2mare, h2mare.cli, h2mare.processing.extractor, h2mare.storage.parquet_indexer"
          /tmp/smoke/bin/h2mare --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
