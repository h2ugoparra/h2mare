# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies: pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies"]
    groups:
      # One PR for all minor/patch bumps instead of one per package.
      # Majors still come one at a time, since those are what can break
      # xarray/zarr/dask behaviour.
      python-minor-patch:
        update-types: ["minor", "patch"]
  # The actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"              # → "ci: bump actions/checkout ..."
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
