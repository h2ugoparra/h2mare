# -----------------------
# Variable Configurations
# -----------------------
variables:
  sst:
    local_folder: CMEMS_SST
    archive_raw: false
    source_vars: [analysed_sst, analysis_error]
    compiled_vars: [sst, analysis_error, sst_std, sst_fdist]
    dataset_id_rep: METOFFICE-GLO-SST-L4-REP-OBS-SST
    dataset_id_nrt: METOFFICE-GLO-SST-L4-NRT-OBS-SST-V2
    source: cmems
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    subset: true
    filename_date_range: true
    bbox: [-80, 0, 10, 70]
    derived_vars:
      sst_std: {op: rolling_std, source: sst, window: 3}

  ssh:
    local_folder: CMEMS_SSH
    archive_raw: false
    source_vars: [adt, sla, ugos, vgos]
    compiled_vars: [adt, sla, ugos, vgos, adt_std, sla_std, gke]
    dataset_id_rep: cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D
    dataset_id_nrt: cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D
    source: cmems
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    subset: true
    filename_date_range: true
    bbox: [-180, -90, 180, 90]
    derived_vars:
      adt_std: {op: rolling_std, source: adt, window: 3}
      sla_std: {op: rolling_std, source: sla, window: 3}
      gke: {op: kinetic_energy, source: [ugos, vgos]}

  mld:
    local_folder: CMEMS_MLD
    archive_raw: false
    source_vars: [mlotst]
    compiled_vars: [mld]
    dataset_id_rep: cmems_mod_glo_phy_my_0.083deg_P1D-m
    source: cmems
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    subset: true
    filename_date_range: true
    bbox: [-80, 0, 10, 70]

  thetao:
    local_folder: CMEMS_Thetao
    archive_raw: false
    source_vars: [thetao]
    compiled_vars: [thetao_100, thetao_200, thetao_500, thetao_1000]
    dataset_id_rep: cmems_mod_glo_phy_my_0.083deg_P1D-m
    source: cmems
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    subset: true
    filename_date_range: true
    bbox: [-80, 0, 10, 70]
    depth_range: [0, 1000]
    compile_depth_slices: [100, 200, 500, 1000]

  chl:
    # Confirmed empty at source, not lost in transit: re-downloading each
    # of these from CMEMS returns a normal 14.6 MB file in which all
    # 3,628,800 pixels are fill. Neighbouring days come back ~60% finite
    # (1998-11-16, 1998-11-21, 2000-11-16, 2000-11-18), so this is not a
    # seasonal effect. Note 'gapfree' in the dataset id means gap-filling
    # within a day's coverage, not that every day has usable input.
    known_gaps:
      - '1998-11-17/1998-11-20'
      - '1998-12-17'
      - '1999-01-25'
      - '1999-11-17/1999-11-18'
      - '2000-11-17'
      - '2001-11-18'
      - '2002-12-31'
    local_folder: CMEMS_Chla_4km_daily
    archive_raw: false
    source_vars: [CHL]
    compiled_vars: [chl, chl_fdist]
    dataset_id_rep: cmems_obs-oc_glo_bgc-plankton_my_l4-gapfree-multi-4km_P1D
    source: cmems
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    subset: true
    filename_date_range: true
    bbox: [-80, 0, 10, 70]

  seapodym:
    local_folder: CMEMS_2nd_productivity/mnkc
    archive_raw: false
    source_vars: [mnkc_epi, mnkc_umeso, mnkc_mumeso, npp, zooc, zeu, mnkc_lmeso, mnkc_hmlmeso, mnkc_mlmeso]
    compiled_vars: [mnkc_epi, mnkc_umeso, mnkc_mumeso, npp, zooc, zeu,mnkc_lmeso, mnkc_hmlmeso, mnkc_mlmeso]
    dataset_id_rep: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i
    source: cmems
    pattern: (\d{8})
    subset: false
    bbox: [-180, -80, 180, 90]

  o2:
    local_folder: CMEMS_Biochemical
    archive_raw: false
    source_vars: [o2]
    compiled_vars: [o2_0, o2_100, o2_500, o2_1000]
    dataset_id_rep: cmems_mod_glo_bgc_my_0.25deg_P1D-m
    source: cmems
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    subset: true
    filename_date_range: true
    bbox: [-80, 0, 10, 70]
    depth_range: [0, 1000]
    compile_depth_slices: [0, 100, 500, 1000]
    
  fsle:
    # AVISO never published this day: the remote NRT listing jumps
    # nrt_..._20250601_... -> nrt_..._20250603_..., so there is no file to
    # fetch and no way to fill the gap. Recorded so the checks stop
    # reporting an unfixable day on every run.
    known_gaps: ['2025-06-02']
    local_folder: AVISO_FSLE
    archive_raw: true
    source_vars: [fsle_max]
    compiled_vars: [fsle_max]
    dataset_id_rep: /value-added/lyapunov/delayed-time/global
    dataset_id_nrt: /value-added/lyapunov/near-real-time/global
    source: aviso
    pattern: _(\d{8})_*
    bbox: [-80, 0, 10, 70]
    rename_lonlat: true

  eddies:
    local_folder: AVISO_Eddy_Trajectory
    archive_raw: true
    source_vars: [
      time,
      latitude,
      longitude,
      track,
      observation_number,
      effective_radius,
      speed_radius,
      amplitude,
      speed_average
      ]
    compiled_vars: [
      ac_amp, ac_dist_km, ac_ndays, ac_normdist, ac_speed, ac_speedrad_km, ac_track,
      c_amp, c_dist_km, c_ndays, c_normdist, c_speed, c_speedrad_km, c_track
      ]
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
    source: aviso
    pattern: (\d{8})_(\d{8})
    raw_include: "_long_|_nrt_"
    bbox: [-80, 0, 10, 70]
    trajectory_format: true
    rename_lonlat: true
    # The atlas gives eddy centres as continuous positions, so this grid is a
    # sampling choice, not a source resolution. 12 (1/12°) matches the finest
    # grid h2ds would be compiled to, so the rasterisation never has to be
    # interpolated upwards, and keeps the distance field within ~19% of a small
    # eddy's radius. The store on disk is still the older 0.1° one — changing
    # this takes effect when it is regenerated.
    cells_per_degree: 12
    values_at: grid_line
    # Each of these holds a property of whichever eddy is nearest, so it is
    # constant over that eddy's neighbourhood and a mean across a boundary
    # describes neither eddy — a track ID averaged with its neighbour's names
    # an eddy that does not exist. dist_km and normdist are left out on
    # purpose: those two are continuous fields and do average.
    regrid:
      ac_track: nearest
      ac_ndays: nearest
      ac_amp: nearest
      ac_speed: nearest
      ac_speedrad_km: nearest
      c_track: nearest
      c_ndays: nearest
      c_amp: nearest
      c_speed: nearest
      c_speedrad_km: nearest
  
  atm-instante:
    local_folder: CDS_Atm_instante
    archive_raw: false
    time_step: hourly
    store_dtype: int16
    source_vars: [
      mean_sea_level_pressure,
      10m_u_component_of_wind,
      10m_v_component_of_wind,
      total_cloud_cover,
      ]
    compiled_vars: [msl, u10, v10, tcc, wind_mean, wind_std, wind_max]
    dataset_id_rep: reanalysis-era5-single-levels
    source: cds
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    filename_date_range: true
    bbox: [-80, 0, 10, 70]

  atm-accum-avg:
    local_folder: CDS_Atm_accum
    archive_raw: false
    time_step: hourly
    store_dtype: int16
    source_vars: [
      total_precipitation,
      mean_northward_turbulent_surface_stress,
      mean_eastward_turbulent_surface_stress,
      ]
    compiled_vars: [
      avg_iews, avg_inss, ekman_pumping, ekman_7d, ekman_anom,
      ekman_anom_lag3, ekman_anom_lag7, ekman_anom_lag14,
      n_upwell_events_3d, n_upwell_events_7d, n_upwell_events_14d, tp
      ]
    dataset_id_rep: reanalysis-era5-single-levels
    source: cds
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    filename_date_range: true
    merge_time_step: true
    bbox: [-80, 0, 10, 70]

  radiation:
    local_folder: CDS_Radiation
    archive_raw: false
    time_step: hourly
    store_dtype: int16
    source_vars: [
      surface_latent_heat_flux,
      surface_solar_radiation_downwards,
      toa_incident_solar_radiation,
      ]
    compiled_vars: [slhf, ssrd, tisr]
    dataset_id_rep: reanalysis-era5-single-levels
    source: cds
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    filename_date_range: true
    merge_time_step: true
    bbox: [-80, 0, 10, 70]

  waves:
    local_folder: CDS_Waves
    archive_raw: false
    time_step: hourly
    store_dtype: int16  
    source_vars: [
      significant_height_of_combined_wind_waves_and_swell,
      mean_direction_of_total_swell,
      ]
    compiled_vars: [swh, mdts]
    dataset_id_rep: reanalysis-era5-single-levels
    source: cds
    pattern: (\d{4}-\d{2}-\d{2})(?:-(\d{4}-\d{2}-\d{2}))?
    filename_date_range: true
    bbox: [-80, 0, 10, 70]

  bathy:
    local_folder: ETOPO_Topography
    archive_raw: false
    source_vars: [z]
    compiled_vars: [bathy, bathy_std]
    dataset_id_rep: Etopo_v1
    source: noaa
    bbox: [-80, 0, 10, 70]
    data_file: etopo_0.25deg_80W-10E-0N-70N_mean-std_surface.nc
    data_file_hires: etopo_15s_80W-10E-0N-70N_surface.zarr

  moon:
    local_folder: MOON_Phases
    archive_raw: false
    source_vars: [moon_phase]
    compiled_vars: [moon_phase]
    dataset_id_rep: ephem4.2
    source: python

  h2ds:
    local_folder: h2ds
    archive_raw: false
    source_vars: []
    compiled_vars: []
    dataset_id_rep: compiled-data-0.25deg-P1D
    source: h2mare
    bbox: [-80, 0, 10, 70]
    # The compile grid: 4 cells per degree is 0.25°, cell-centred, which is what
    # this store holds, with the values at cell centres. Changing either key
    # needs a new store (its own local_folder and dataset_id_rep) — the write
    # path refuses to merge one grid into another. See "Where the values sit"
    # in docs/configuration.md.
    cells_per_degree: 4
    values_at: cell_center


# Fixed root attributes for h2ds. Everything here is a choice - what the
# dataset is called, who to contact, what may be done with it.
#
# The facts about a given file are not here and cannot be: Conventions,
# product_version, history and the geospatial/time extents are written by
# provenance.refresh_root_attrs at compile, read off the store itself. A
# per-period store holds a different span in every file, so config could only
# ever state one of them wrongly.
global_attrs:
  title: h2ds - Integrated Geospatial Dataset Collection for the North Atlantic
  summary: >-
    Daily ocean and atmosphere variables for the North Atlantic on a common 0.25 degree grid,
    compiled from CMEMS, AVISO, ERA5 and ETOPO products. Sea surface temperature and fronts,
    sea surface height and geostrophic currents, mixed layer depth, chlorophyll, dissolved
    oxygen and potential temperature at depth, micronekton and productivity, eddy and
    Lyapunov diagnostics, wind, pressure, precipitation, radiation, waves, bathymetry and
    moon phase.
  keywords: >-
    oceanography, sea surface temperature, sea surface height, ocean colour, chlorophyll,
    mixed layer depth, dissolved oxygen, mesoscale eddies, Ekman pumping, upwelling, waves,
    reanalysis, North Atlantic
  source: Various reanalysis and observational datasets from CMEMS/AVISO/NCEI-ETOPO/CDS-ERA5
  project: h2mare - Geospatial Processing for Climate and Ocean Data
  references: https://github.com/h2ugoparra/h2mare
  # The h2mare source is MIT; the data is not h2mare's to license. Each source
  # product carries its own terms and they travel with these values.
  license: >-
    Derived product. Redistribution and use are subject to the terms of each source product
    (CMEMS, AVISO, Copernicus/ECMWF ERA5, NOAA NCEI ETOPO); see the per-variable product_id
    and dataset_id attributes for provenance.
  creator_name: Hugo Parra
  creator_email: h2ugo.parra@pm.me
  date_created: '2024-06-12'
  geospatial_lat_resolution: 0.25
  geospatial_lat_units: degrees_north
  geospatial_lon_resolution: 0.25
  geospatial_lon_units: degrees_east
  comment: For variables with less than 0.25 spatial resolution (all except o2), upscalling was done using xarray interp function with linear method

variable_attrs:
# SST
  sst:
    short_name: SST
    long_name: Analysed sea surface temperature
    standard_name: sea_surface_foundation_temperature
    units: degree_C
    comment: Temperature of the topmost layer of the ocean. Taken as delivered by the OSTIA L4 analysis, which blends satellite and in situ measurements into a gap-free daily field.
    product_id_rep: SST_GLO_SST_L4_REP_Observations_010_011
    product_id_nrt: SST_GLO_SST_L4_NRT_Observations_010_001
    dataset_id_rep: METOFFICE-GLO-SST-L4-REP-OBS-SST
    dataset_id_nrt: METOFFICE-GLO-SST-L4-NRT-OBS-SST-V2
  
  sst_std:
    short_name: SST Std
    long_name: Standard deviation of analysed sea surface temperature
    units: degree_C
    comment: Derived from a rolling mean (3*3 cells) from sst native resolution.
    product_id_rep: SST_GLO_SST_L4_REP_Observations_010_011
    product_id_nrt: SST_GLO_SST_L4_NRT_Observations_010_001
    dataset_id_rep: METOFFICE-GLO-SST-L4-REP-OBS-SST
    dataset_id_nrt: METOFFICE-GLO-SST-L4-NRT-OBS-SST-V2
  
  sst_fdist:
    short_name: SST FrontDist
    long_name: Distance to nearest SST front
    units: km
    comment: Front detection using the Belkin and O'Reilly (2009) method and a threshold value of 0.4.
    product_id_rep: SST_GLO_SST_L4_REP_Observations_010_011
    product_id_nrt: SST_GLO_SST_L4_NRT_Observations_010_001
    dataset_id_rep: METOFFICE-GLO-SST-L4-REP-OBS-SST
    dataset_id_nrt: METOFFICE-GLO-SST-L4-NRT-OBS-SST-V2

  analysis_error:
    short_name: SST Error Std 
    long_name: Estimated error standard deviation of analysed_sst (sst)
    standard_name: sea_surface_foundation_temperature standard_error
    units: kelvin
    comment: OSTIA foundation SST analysis standard deviation error.
    product_id_rep: SST_GLO_SST_L4_REP_Observations_010_011
    product_id_nrt: SST_GLO_SST_L4_NRT_Observations_010_001
    dataset_id_rep: METOFFICE-GLO-SST-L4-REP-OBS-SST
    dataset_id_nrt: METOFFICE-GLO-SST-L4-NRT-OBS-SST-V2
# SSH
  adt:
    short_name: ADT
    long_name: Absolute dynamic topography
    standard_name: sea_surface_height_above_geoid
    units: m
    comment: Instantaneous height of the sea surface relative to the geoid.
    product_id_rep: SEALEVEL_GLO_PHY_L4_MY_008_047
    product_id_nrt: SEALEVEL_GLO_PHY_L4_NRT_008_046
    dataset_id_rep: cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D
    dataset_id_nrt: cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D
  
  adt_std:
    short_name: ADT Std
    long_name: Standard deviation of absolute dynamic topography
    units: m
    comment: Derived from a rolling mean (3*3 cells) from adt native resolution.
    product_id_rep: SEALEVEL_GLO_PHY_L4_MY_008_047
    product_id_nrt: SEALEVEL_GLO_PHY_L4_NRT_008_046
    dataset_id_rep: cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D
    dataset_id_nrt: cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D
  
  sla:
    short_name: SLA
    long_name: Sea level anomaly
    standard_name: sea_surface_height_above_mean_sea_level
    units: m
    comment: Sea surface height above mean sea surface height.
    product_id_rep: SEALEVEL_GLO_PHY_L4_MY_008_047
    product_id_nrt: SEALEVEL_GLO_PHY_L4_NRT_008_046
    dataset_id_rep: cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D
    dataset_id_nrt: cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D
  
  sla_std:
    short_name: SLA Std
    long_name: Standard deviation of sea level anomaly
    units: m
    comment: Derived from a rolling mean (3*3 cells) from sla native resolution.
    product_id_rep: SEALEVEL_GLO_PHY_L4_MY_008_047
    product_id_nrt: SEALEVEL_GLO_PHY_L4_NRT_008_046
    dataset_id_rep: cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D
    dataset_id_nrt: cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D
  
  ugos:
    short_name: UGOS
    long_name: Sea surface velocity along the u-direction
    standard_name: surface_geostrophic_eastward_sea_water_velocity
    units: m.s-1
    comment: Velocity of the sea surface in the u-direction (W-E).
    product_id_rep: SEALEVEL_GLO_PHY_L4_MY_008_047
    product_id_nrt: SEALEVEL_GLO_PHY_L4_NRT_008_046
    dataset_id_rep: cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D
    dataset_id_nrt: cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D
  
  vgos:
    short_name: VGOS
    long_name: Sea surface velocity along the v-direction
    standard_name: surface_geostrophic_northward_sea_water_velocity
    units: m.s-1
    comment: Velocity of the sea surface in the v-direction (N-S).
    product_id_rep: SEALEVEL_GLO_PHY_L4_MY_008_047
    product_id_nrt: SEALEVEL_GLO_PHY_L4_NRT_008_046
    dataset_id_rep: cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D
    dataset_id_nrt: cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D
  
  gke:
    short_name: GKE
    long_name: Geostrophic Kinetic Energy
    standard_name: specific_kinetic_energy_of_sea_water
    units: m2.s-2
    comment: Kinetic energy per unit mass of the total surface geostrophic flow, computed as 0.5*(ugos^2 + vgos^2).
    product_id_rep: SEALEVEL_GLO_PHY_L4_MY_008_047
    product_id_nrt: SEALEVEL_GLO_PHY_L4_NRT_008_046
    dataset_id_rep: cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D
    dataset_id_nrt: cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D
  
# MLD
  mld:
    short_name: MLD
    long_name: Mixed layer depth
    standard_name: ocean_mixed_layer_thickness_defined_by_sigma_theta
    units: m
    comment: Thickness of the well-mixed surface layer. Its base is the depth at which density has risen above its 10 m value by as much as cooling the surface by 0.2 degrees C would cause.
    product_id: GLOBAL_MULTIYEAR_PHY_001_030
    dataset_id: cmems_mod_glo_phy_my_0.083deg_P1D-m

# CHL
  chl:
    short_name: CHL
    long_name: Chlorophyll-a concentration
    standard_name: mass_concentration_of_chlorophyll_a_in_sea_water
    units: mg.m-3
    comment: Concentration of chlorophyll-a in surface water, used as a proxy for how much phytoplankton is present. Taken as delivered by the gap-free multi-sensor ocean-colour L4 product.
    product_id: OCEANCOLOUR_GLO_BGC_L4_MY_009_104
    dataset_id: cmems_obs-oc_glo_bgc-plankton_my_l4-gapfree-multi-4km_P1D
  
  chl_fdist:
    short_name: CHL FrontDist
    long_name: Distance to nearest Chlorophyll-a front
    units: km
    comment: Front detection defined by Belkin and O'Reilly (2009) method and a threshold value of 0.06.
    product_id: OCEANCOLOUR_GLO_BGC_L4_MY_009_104
    dataset_id: cmems_obs-oc_glo_bgc-plankton_my_l4-gapfree-multi-4km_P1D

# SEAPODYM
  mnkc_epi:
    short_name: MNKC EPI
    long_name: Mass content of epipelagic micronekton expressed as wet weight
    standard_name: ocean_wet_mass_content_of_epipelagic_micronekton
    units: g.m-2
    comment: Component of the micronekton that inhabits permanently the epipelagic layer. Micronekton is classically defined by a size range of 2cm-20 cm. 
      It contains a large diversity of fish, crustacean, squid and gelatinous species. It can be only a temporary stage for species with large growth potential.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i

  mnkc_hmlmeso:
    short_name: MNKC HMLMESO
    long_name: Mass content of highly migrant lower mesopelagic micronekton expressed as wet weight
    standard_name: ocean_wet_mass_content_of_highly_migrant_lower_mesopelagic_micronekton
    units: g.m-2
    comment: Component of the micronekton that inhabits the lower mesopelagic layer during daytime and the epipelagic layer during nighttime. 
      Micronekton is classically defined by a size range of 2cm-20 cm. It contains a large diversity of fish, crustacean, squid and gelatinous species. 
      It can be only a temporary stage for species with large growth potential.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i
  
  mnkc_lmeso:
    short_name: MNKC LMESO
    long_name: Mass content of lower mesopelagic micronekton expressed as wet weight
    standard_name: ocean_wet_mass_content_of_lower_mesopelagic_micronekton
    units: g.m-2
    comment: Component of the micronekton that inhabits permanently the lower mesopelagic layer. Micronekton is classically defined by a size range of 2cm-20 cm. 
      It contains a large diversity of fish, crustacean, squid and gelatinous species. It can be only a temporary stage for species with large growth potential.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i

  mnkc_mlmeso:
    short_name: MNKC MLMESO
    long_name: Mass content of migrant lower mesopelagic micronekton expressed as wet weight
    standard_name: ocean_wet_mass_content_of_migrant_lower_mesopelagic_micronekton
    units: g.m-2
    comment: Component of the micronekton that inhabits the lower mesopelagic layer during daytime and the upper mesopelagic layer during nighttime.
      Micronekton is classically defined by a size range of 2cm-20 cm. It contains a large diversity of fish, crustacean, squid and gelatinous species. 
      It can be only a temporary stage for species with large growth potential.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i

  mnkc_mumeso:
    short_name: MNKC MUMESO
    long_name: Mass content of migrant upper mesopelagic micronekton expressed as wet weight
    standard_name: ocean_wet_mass_content_of_migrant_upper_mesopelagic_micronekton
    units: g.m-2
    comment: Component of the micronekton that inhabits the upper mesopelagic layer during daytime and the epipelagic layer during nighttime. 
      Micronekton is classically defined by a size range of 2cm-20 cm. It contains a large diversity of fish, crustacean, squid and gelatinous species. 
      It can be only a temporary stage for species with large growth potential.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i

  mnkc_umeso:
    short_name: MNKC UMESO
    long_name: Mass content of upper mesopelagic micronekton expressed as wet weight
    standard_name: ocean_wet_mass_content_of_upper_mesopelagic_micronekton
    units: g.m-2
    comment: Component of the micronekton that inhabits permanently the upper mesopelagic layer. 
      Micronekton is classically defined by a size range of 2cm-20 cm. 
      It contains a large diversity of fish, crustacean, squid and gelatinous species. 
      It can be only a temporary stage for species with large growth potential.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i
  
  npp:
    short_name: NPP
    long_name: Net primary productivity of biomass
    standard_name: net_primary_productivity_of_biomass_expressed_as_carbon
    units: mg.m-2.day-1
    comment: Rate at which phytoplankton build new biomass from carbon. Model output from the CMEMS low- and mid-trophic level product, taken as delivered.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i
  
  zeu:
    short_name: ZEU
    long_name: Euphotic zone depth
    units: m
    comment: Depth that sunlight reaches in useful amounts, conventionally where light falls to 1 percent of its surface value, so it marks the bottom of the layer where photosynthesis happens. Model output, taken as delivered.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i
  
  zooc:
    short_name: ZOOC
    long_name: Mass content of zooplankton expressed in carbon
    standard_name: ocean_mass_content_of_zooplankton_expressed_as_carbon
    units: g.m-2
    comment: Zooplankton biomass in the water column expressed as carbon, the prey field linking plankton production to fish and larger predators. Model output, taken as delivered.
    product_id: GLOBAL_MULTIYEAR_BGC_001_033
    dataset_id: cmems_mod_glo_bgc_my_0.083deg-lmtl_P1D-i
