# FSLE
  fsle_max:
    short_name: FSLE 
    long_name: Backward-in-time Finite Size Lyapunov Exponents
    units: days-1
    comment: Finite-Size Lyapunov Exponents (FSLEs) based on the maximum eigenvalue of the Cauchy-Green strain tensor.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/lyapunov/delayed-time/global
    dataset_id_nrt: /value-added/lyapunov/near-real-time/global

# EDDIES
  ac_amp:
    short_name: AC Amplitude
    long_name: Amplitude of anticyclonic eddy
    units: m
    comment: Height of the sea-surface bulge of the nearest anticyclonic eddy, measured between its centre and its outer contour, which indicates how strong the eddy is. Each cell is assigned the values of the closest anticyclonic eddy centre tracked that day in the AVISO META3.2 atlas.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  ac_dist_km:
    short_name: AC CenterDist 
    long_name: Distance to anticyclonic eddy center
    units: km
    comment: How far the cell is from the centre of the nearest anticyclonic eddy, so small values mean the cell sits inside or beside an eddy. Great-circle distance to the closest eddy centre tracked that day.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  ac_ndays:
    short_name: AC Duration
    long_name: Days starting at the first anticyclonic eddy detection
    units: d
    comment: Age of the nearest anticyclonic eddy, counted from the day it was first detected. Read from the observation number along the eddy's tracked trajectory.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  ac_normdist:
    short_name: AC NormDist
    long_name: Normalized distance to anticyclonic eddy center
    units: 1
    comment: Normalized distance to anticyclonic eddy center relative to the radius of the eddy. 0=center, 1=radius.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  ac_speed:
    short_name: AC Radius Speed
    long_name: Average speed of the contour defining the radius scale of the anticyclonic eddy
    units: m.s-1
    comment: How fast water circulates around the nearest anticyclonic eddy, averaged along the contour that defines its radius. Assigned from the closest anticyclonic eddy centre tracked that day.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  ac_speedrad_km:
    short_name: AC Radius
    long_name: Radius of the best fit circle corresponding to the contour of maximum circum-average speed of the anticyclonic eddy
    units: km
    comment: Size of the nearest anticyclonic eddy, taken as the best-fit circle through its fastest-rotating contour. Assigned from the closest eddy centre tracked that day and converted from metres to kilometres.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  ac_track:
    short_name: AC ID Number
    long_name: Trajectory identification number of the anticyclonic eddy
    comment: Identity number of the nearest anticyclonic eddy, which lets the same eddy be followed from day to day. An ordinal label only, so differences between values carry no meaning.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  c_amp:
    short_name: C Amplitude
    long_name: Amplitude of cyclonic eddy
    units: m
    comment: Height of the sea-surface depression of the nearest cyclonic eddy, measured between its centre and its outer contour, which indicates how strong the eddy is. Each cell is assigned the values of the closest cyclonic eddy centre tracked that day in the AVISO META3.2 atlas.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time

  c_dist_km:
    short_name: C CenterDist
    long_name: Distance to cyclonic eddy center
    units: km
    comment: How far the cell is from the centre of the nearest cyclonic eddy, so small values mean the cell sits inside or beside an eddy. Great-circle distance to the closest eddy centre tracked that day.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time

  c_ndays:
    short_name: C Duration
    long_name: Days starting at the first cyclonic eddy detection
    units: d
    comment: Age of the nearest cyclonic eddy, counted from the day it was first detected. Read from the observation number along the eddy's tracked trajectory.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time

  c_normdist:
    short_name: C NormDist
    long_name: Normalized distance to cyclonic eddy center
    units: 1
    comment: Normalized distance to cyclonic eddy center relative to the radius of the eddy. 0=center, 1=radius.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  c_speed:
    short_name: C Radius Speed
    long_name: Average speed of the contour defining the radius scale of the cyclonic eddy
    units: m.s-1
    comment: How fast water circulates around the nearest cyclonic eddy, averaged along the contour that defines its radius. Assigned from the closest cyclonic eddy centre tracked that day.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  c_speedrad_km:
    short_name: C Radius
    long_name: Radius of the best fit circle corresponding to the contour of maximum circum-average speed of the cyclonic eddy
    units: km
    comment: Size of the nearest cyclonic eddy, taken as the best-fit circle through its fastest-rotating contour. Assigned from the closest eddy centre tracked that day and converted from metres to kilometres.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time
  
  c_track:
    short_name: C ID Number
    long_name: Trajectory identification number of the cyclonic eddy
    comment: Identity number of the nearest cyclonic eddy, which lets the same eddy be followed from day to day. An ordinal label only, so differences between values carry no meaning.
    product_id: ftp://ftp-access-aviso.altimetry.fr
    dataset_id_rep: /value-added/eddy-trajectory/delayed-time/META3.2_DT_allsat
    dataset_id_nrt: /value-added/eddy-trajectory/near-real-time

# BATHY  
  bathy:
    short_name: Bathymetry
    long_name: Bathymetry
    standard_name: altitude
    units: m
    positive: up
    comment: Mean ocean depth calculated for each 0.25deg cell where original resolution cells (15arc-sec) fall into it.
      Carries the sign convention of the ETOPO source - height above the geoid, positive up, so sea floor values are negative.
    product_id: ETOPO 2022 v1 15arc-secs
    dataset_id: Etopo_v1

  bathy_std:
    short_name: Bathymetry std
    long_name: Standard deviation of bathymetry
    units: m
    comment: Spread of sea-floor depth within each 0.25deg cell, indicating how rough or steep the terrain is. Standard deviation over all the 15arc-sec source cells falling inside it.
    product_id: ETOPO 2022 v1 15arc-secs
    dataset_id: Etopo_v1
  
# MOON  
  moon_phase:
    short_name: Moon Light
    long_name: Moon illumination
    units: percent
    comment: Percentage of the Moon's disc that is lit, a proxy for how much light is available at night. Computed with the ephem library for the centre of the domain and repeated across the grid, so it varies with date but not with position.
    product_id: ephem 4.2 python package
    dataset_id: ephem4.2

# ATM-INSTANTE
  msl:
    short_name: MSL
    long_name: Mean sea level pressure
    standard_name: air_pressure_at_mean_sea_level
    units: hPa
    cell_methods: 'time: mean'
    comment: Air pressure reduced to sea level. Daily mean of the hourly ERA5 field, converted from Pa to hPa.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  tcc:
    short_name: TCC
    long_name: Total cloud cover
    standard_name: cloud_area_fraction
    units: '1'
    cell_methods: 'time: mean'
    comment: Share of the sky covered by cloud, from 0 for clear to 1 for overcast. Daily mean of the hourly ERA5 field.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  u10:
    short_name: U10
    long_name: 10m u wind component
    standard_name: eastward_wind
    units: m.s-1
    cell_methods: 'time: mean'
    comment: East-west part of the wind 10 m above the surface, positive when blowing towards the east. Daily mean of the hourly ERA5 component.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  v10:
    short_name: V10
    long_name: 10m v wind component
    standard_name: northward_wind
    units: m.s-1
    cell_methods: 'time: mean'
    comment: North-south part of the wind 10 m above the surface, positive when blowing towards the north. Daily mean of the hourly ERA5 component.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  wind_max:
    short_name: Wind Max
    long_name: 10m maximum wind speed
    standard_name: wind_speed
    units: m.s-1
    cell_methods: 'time: maximum'
    comment: Strongest wind of the day 10 m above the surface. Largest of the 24 hourly speeds, so it captures sustained hourly wind rather than short gusts.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  wind_mean:
    short_name: Wind Mean
    long_name: 10m mean wind speed
    standard_name: wind_speed
    units: m.s-1
    cell_methods: 'time: mean'
    comment: Typical wind strength over the day 10 m above the surface. Wind speed is formed each hour as sqrt(u10^2 + v10^2) and those hourly speeds are then averaged, which is not the same as the speed of the daily mean wind vector.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
    
  wind_std:
    short_name: Wind Std
    long_name: 10m standard deviation of wind speed
    standard_name: wind_speed
    units: m.s-1
    cell_methods: 'time: standard_deviation'
    comment: How much the wind strength varied through the day, separating steady winds from unsettled ones. Standard deviation of the 24 hourly speeds.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
# ATM-ACCUM-AVG
  avg_iews:
    short_name: AVG IEWS
    long_name: Mean eastward turbulent surface stress
    standard_name: surface_downward_eastward_stress
    units: N.m-2
    cell_methods: 'time: mean'
    comment: Eastward part of the drag the wind exerts on the sea surface, positive when pushing water towards the east. Daily mean of the hourly ERA5 field.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  avg_inss:
    short_name: AVG INSS
    long_name: Mean northward turbulent surface stress
    standard_name: surface_downward_northward_stress
    units: N.m-2
    cell_methods: 'time: mean'
    comment: Northward part of the drag the wind exerts on the sea surface, positive when pushing water towards the north. Daily mean of the hourly ERA5 field.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  ekman_7d:
    short_name: Ekman 7d
    long_name: Ekman 7-day mean vertical velocity
    units: m.s-1
    comment: Ekman pumping averaged over a rolling 7-day window, which smooths out day-to-day noise. The window is allowed to be partial, so the first 6 days of the archive average fewer than 7 days rather than being null.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  ekman_anom:
    short_name: Ekman Anom
    long_name: Ekman vertical velocity anomaly
    units: m.s-1
    comment: Ekman anomaly calculated by the difference between a 7-day rolling mean Ekman pumping and 1998-2017 climatology, per day-of-year (DOY) and grid cell.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  ekman_anom_lag3:
    short_name: Ekman Anom lag3
    long_name: Ekman vertical velocity anomaly lagged by 3 days
    units: m.s-1
    comment: 3-days lagged Ekman anomaly calculated as the difference between a 7-day rolling mean Ekman pumping and 1998-2017 climatology, per day-of-year (DOY) and grid cell.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  ekman_anom_lag7:
    short_name: Ekman Anom lag7
    long_name: Ekman vertical velocity anomaly lagged by 7 days
    units: m.s-1
    comment: 7-days lagged Ekman anomaly calculated as the difference between a 7-day rolling mean Ekman pumping and 1998-2017 climatology, per day-of-year (DOY) and grid cell.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  ekman_anom_lag14:
    short_name: Ekman Anom lag14
    long_name: Ekman vertical velocity anomaly lagged by 14 days
    units: m.s-1
    comment: 14-days lagged Ekman anomaly calculated as the difference between a 7-day rolling mean Ekman pumping and 1998-2017 climatology, per day-of-year (DOY) and grid cell.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  ekman_pumping:
    short_name: Ekman Pump
    long_name: Ekman vertical velocity
    units: m.s-1
    cell_methods: 'time: mean'
    comment: Daily Ekman pumping mean velocity derived from hourly data of surface wind stress curl/turbulence components. Pumping is defined as vertical velocity at the base of the Ekman layer. positive = upwelling (suction), negative = downwelling (pumping).
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  n_upwell_events_3d:
    short_name: Upwell 3d
    long_name: Number of Ekman pumping upwelling events within 3-days
    units: count
    comment: Daily count of events where Ekman pumping anomaly exceeded the 90th percentile threshold from the 1998 to 2017 monthly climatology computed for each grid cell and accumulated within a rolling 3-day window. Values run from 0 (no events) to 3 (every day in the window exceeded), and are null over the first 2 days of the archive, where the window is not yet full. The number counts events, not elapsed days.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  n_upwell_events_7d:
    short_name: Upwell 7d
    long_name: Number of Ekman pumping upwelling events within 7-days
    units: count
    comment: Daily count of events where Ekman pumping anomaly exceeded the 90th percentile threshold from the 1998 to 2017 monthly climatology computed for each grid cell and accumulated within a rolling 7-day window. Values run from 0 (no events) to 7 (every day in the window exceeded), and are null over the first 6 days of the archive, where the window is not yet full. The number counts events, not elapsed days.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
  
  n_upwell_events_14d:
    short_name: Upwell 14d
    long_name: Number of Ekman pumping upwelling events within 14-days
    units: count
    comment: Daily count of events where Ekman pumping anomaly exceeded the 90th percentile threshold from the 1998 to 2017 monthly climatology computed for each grid cell and accumulated within a rolling 14-day window. Values run from 0 (no events) to 14 (every day in the window exceeded), and are null over the first 13 days of the archive, where the window is not yet full. The number counts events, not elapsed days.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels
 
  tp:
    short_name: TP
    long_name: Total accumulated precipitation
    standard_name: lwe_thickness_of_precipitation_amount
    units: mm
    cell_methods: 'time: sum'
    comment: Daily accumulated precipitation, obtained by summing hourly precipitation rates (mm) over each 24-hour period. 1mm of rain is equivalent to 1 kg.m-2.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels

# RADIATION
  slhf:
    short_name: SLHF
    long_name: Surface latent heat flux
    standard_name: surface_downward_latent_heat_flux
    units: W.m-2
    cell_methods: 'time: mean'
    comment: Energy the sea surface loses to the air by evaporation; negative means upward, which is the norm over the ocean. From ERA5 hourly accumulations (J.m-2) divided by their 3600 s interval to give mean rates, then averaged over each day.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels

  ssrd:
    short_name: SSRD
    long_name: Surface solar radiation downwards
    standard_name: surface_downwelling_shortwave_flux_in_air
    units: W.m-2
    cell_methods: 'time: mean'
    comment: Sunlight reaching the sea surface, after clouds and the atmosphere absorb and scatter part of it. From ERA5 hourly accumulations (J.m-2) divided by their 3600 s interval to give mean rates, then averaged over each day.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels

  tisr:
    short_name: TISR
    long_name: TOA incident solar radiation
    standard_name: toa_incoming_shortwave_flux
    units: W.m-2
    cell_methods: 'time: mean'
    comment: Sunlight arriving at the top of the atmosphere, set by sun-earth geometry alone and so the ceiling that ssrd is measured against. From ERA5 hourly accumulations (J.m-2) divided by their 3600 s interval to give mean rates, then averaged over each day.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels

# WAVES
  mdts:
    short_name: MDTS
    long_name: Mean direction of total swell
    standard_name: sea_surface_swell_wave_from_direction
    units: degree
    cell_methods: 'time: mean'
    comment: Mean heading of the combined swell in degrees clockwise from north. Averaged over the day as unit vectors and recombined, because averaging degrees directly would put 350 and 10 degrees at 180.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels

  swh:
    short_name: SWH
    long_name: Significant height of combined wind, waves and swell
    standard_name: sea_surface_wave_significant_height
    units: m
    cell_methods: 'time: mean'
    comment: Height of the combined wind sea and swell, defined as the mean height of the highest third of waves. Daily mean of the hourly ERA5 field.
    product_id: ERA5 reanalysis
    dataset_id: reanalysis-era5-single-levels

# ----------------------------------------------------------------------
# Native-store attribute overrides
# ----------------------------------------------------------------------
# variable_attrs above describes what h2ds publishes. Where a native
# per-variable store holds the same quantity differently, the delta goes here,
# keyed by var_key and then by variable name. A null value removes the
# attribute instead of setting it.
#
# Only the hourly CDS stores need entries. They keep ERA5's own units, because
# the conversion happens on the way into h2ds (see cds.hourly_atm_instante and
# store_hourly_atm_accum), and they keep ERA5's own hourly cadence, so the
# cell_methods naming a daily reduction does not apply to them.
#
# Radiation is deliberately absent: hourly_radiation converts J.m-2 to W.m-2 at
# both cadences, so the native store already publishes h2ds's units, and each
# hourly value is a mean over its own interval, so 'time: mean' still holds.
native_attr_overrides:
  atm-instante:
    msl:
      units: Pa           # hPa only after daily_sea_level_pressure runs
      cell_methods: null  # hourly instantaneous, not a daily mean
    u10:
      cell_methods: null
    v10:
      cell_methods: null
    tcc:
      cell_methods: null

  atm-accum-avg:
    tp:
      units: m            # mm only after daily_total_rain multiplies by 1000
      # cell_methods stays 'time: sum': an hourly ERA5 accumulation is already
      # a sum over its own interval.

  waves:
    swh:
      cell_methods: null  # hourly instantaneous
    mdts:
      cell_methods: null
 
 

