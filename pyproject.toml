[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h2mare"
version = "0.8.1"
description = "Downloader and data management tools for climate and ocean datasets."
authors = [
    { name = "Hugo Parra", email = "h2ugo.parra@pm.me" }
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ocean", "climate", "geospatial", "zarr", "netcdf", "cmems", "copernicus", "era5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "cartopy>=0.23.0",
    "cdsapi>=0.7.0",
    # xarray engine plugins, selected by name rather than imported
    # (netcdf2zarr.py:138), so nothing in the source references them.
    "cfgrib>=0.9.10",
    "eccodes>=1.7.0",
    "netCDF4>=1.6.0",
    "copernicusmarine>=2.4.1",
    "dask>=2024.1.0",
    "duckdb>=1.0.0",
    "ephem>=4.1.0",
    "geopandas>=1.0.0",
    "global_land_mask>=1.0.0",
    "ipython>=8.0.0",
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "msgspec>=0.18.0",
    # Imported directly throughout the package but previously undeclared,
    # arriving only as transitives of xarray/geopandas/rioxarray/polars. That
    # worked here because uv.lock pinned them, and broke nothing until someone
    # ran `pip install h2mare`, where the resolver is free to pick anything.
    # zarr is the sharp one: the code is written against the 3.x API
    # (zarr.codecs.ZstdCodec, consolidated=False on every read).
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "rasterio>=1.3",
    "shapely>=2.0",
    "zarr>=3.0",
    "plotly>=5.24.0",
    "polars>=1.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "rioxarray>=0.17.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.6",
    "tenacity>=8.0.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
    "xarray>=2024.1.0",
]

[project.urls]
Repository = "https://github.com/h2ugoparra/h2mare"

[project.scripts]
h2mare = "h2mare.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["h2mare*"]

[dependency-groups]
dev = [
    "cf-units>=3.3",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "tox>=4.30.3",
    "tox-uv>=1.28.1",
]
# Building the docs site. Not a runtime concern: these shipped to every install
# as project dependencies, and the docs workflow installs them itself anyway
# (`uv run --no-project --with mkdocs-material mkdocs build`).
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
]

[tool.ruff]
line-length = 88
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# Two known-benign warnings accounted for every one of the suite's ~207 warnings.
# Pinning them by message keeps the output meaningful: anything that shows up now
# is new and worth reading, rather than buried in known noise.
filterwarnings = [
    # zarr 3.x warns that consolidated metadata sits outside the Zarr v3 spec.
    # Every to_zarr() writes it (xarray's default) and every read in h2mare
    # passes consolidated=False, so we never depend on it; appends re-consolidate,
    # so it cannot go stale either. Verified against the append path.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification:zarr.errors.ZarrUserWarning",
    # netCDF4's Cython extension reports a smaller compile-time ndarray struct
    # than numpy 2.x provides at runtime. Cython only warns in this direction —
    # it raises ImportError when the runtime struct is the smaller one — and the
    # extension round-trips correctly. Drops out once netCDF4 ships a wheel built
    # against numpy 2.4.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = py311, py312, py313
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
# `dependency_groups`, not `extras`: dev is a PEP 735 group under
# [dependency-groups], and asking for it as an extra failed every environment
# with "Extra `dev` is not defined in the project's `optional-dependencies`
# table" before a single test ran. CI calls pytest directly, so nothing caught
# it — the advertised py311/py312/py313 matrix and the pyright env had never
# run. [testenv:pyright] inherits this, so the one line fixes both.
dependency_groups = dev
commands =
    pytest tests/ -q

[testenv:pyright]
# Exits non-zero on the standing finding count (~207, mostly pandas/xarray stub
# noise), same as the informational CI job — that is the current baseline, not a
# broken environment. Compare the count against CI's rather than reading FAIL as
# a regression.
description = Static type check with pyright (targets the 3.11 floor via pyrightconfig.json)
commands =
    pyright h2mare
"""
